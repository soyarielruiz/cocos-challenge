services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cocos_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cocos_challenge"]
      interval: 2s
      timeout: 3s
      retries: 15
